<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Save the Date</title>
  <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,wght@0,400;0,500;1,400&family=Mrs+Saint+Delafield&family=Montserrat:wght@400;500&display=swap" rel="stylesheet">
  <style>
    /* Arte vertical para status/story: abra no navegador e exporte em 1080x1920 (540x960 com zoom 2x) */
    *{box-sizing:border-box;margin:0;padding:0}
    body{background:#222;display:flex;justify-content:center;align-items:center;min-height:100vh}
    .card{position:relative;width:540px;height:960px;overflow:hidden;color:#fff;font-family:'Montserrat',sans-serif;text-align:center}
    .sky{position:absolute;inset:0;background:linear-gradient(180deg,#ffd98a 0%,#ffb76b 20%,#ff8f5e 36%,#f97a7f 46%,#ef6b8c 52%)}
    .sun{position:absolute;left:50%;top:50%;width:300px;height:300px;border-radius:50%;transform:translate(-50%,-66%);
      background:radial-gradient(circle,#fff8e1 0%,#ffe9a8 38%,rgba(255,214,140,.55) 55%,rgba(255,190,120,0) 72%)}
    .sea{position:absolute;left:0;right:0;top:50%;bottom:0;background:linear-gradient(180deg,#e9688a 0%,#c24c78 30%,#8f3560 70%,#5e2443 100%)}
    .sea::before{content:"";position:absolute;left:50%;top:0;width:300px;height:55%;transform:translateX(-50%);
      background:repeating-linear-gradient(180deg,rgba(255,236,170,.75) 0 2px,transparent 2px 10px);
      -webkit-mask:radial-gradient(ellipse 50% 100% at 50% 0,#000 20%,transparent 75%);mask:radial-gradient(ellipse 50% 100% at 50% 0,#000 20%,transparent 75%)}
    .bq{position:absolute;width:300px;height:300px;filter:drop-shadow(0 8px 12px rgba(60,10,30,.35))}
    .bq.tl{left:-130px;top:-120px;transform:rotate(160deg)}
    .bq.tr{right:-125px;top:-130px;transform:rotate(205deg)}
    .bq.bl{left:-120px;bottom:-120px;transform:rotate(25deg)}
    .bq.br{right:-130px;bottom:-125px;transform:rotate(-120deg)}
    .top{position:absolute;left:0;right:0;top:150px;color:#7a2e1a}
    .top .sig{font-family:'Mrs Saint Delafield',cursive;font-size:96px;line-height:1;background:linear-gradient(100deg,#d9480f,#c2255c 55%,#e67700);-webkit-background-clip:text;background-clip:text;color:transparent}
    .top p{margin-top:-6px;font-family:'Bodoni Moda',serif;font-size:30px;letter-spacing:.42em;padding-left:.42em}
    .bottom{position:absolute;left:0;right:0;bottom:150px}
    .names{font-family:'Bodoni Moda',serif;font-size:44px;letter-spacing:.12em;text-transform:uppercase;line-height:1.05;text-shadow:0 2px 18px rgba(60,10,30,.35)}
    .names span{display:block;font-family:'Mrs Saint Delafield',cursive;text-transform:none;letter-spacing:0;font-size:60px;line-height:.75;margin:4px 0}
    .date{margin-top:26px;font-family:'Bodoni Moda',serif;font-size:66px;line-height:1;letter-spacing:.04em}
    .city{margin:16px auto 0;display:inline-block;padding:9px 18px;border-top:1px solid rgba(255,255,255,.75);border-bottom:1px solid rgba(255,255,255,.75);font-size:13px;letter-spacing:.38em;text-transform:uppercase}
    .note{margin-top:16px;font-size:12px;letter-spacing:.2em;text-transform:uppercase;opacity:.85}
    .brand{position:absolute;left:0;right:0;bottom:22px;font-size:11px;opacity:.75;letter-spacing:.05em}
  </style>
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
    <linearGradient id="gRosa" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff9fb8"/><stop offset="1" stop-color="#d6336c"/></linearGradient>
    <linearGradient id="gLaranja" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffc078"/><stop offset="1" stop-color="#f76707"/></linearGradient>
    <linearGradient id="gAmarelo" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffec99"/><stop offset="1" stop-color="#f59f00"/></linearGradient>
    <linearGradient id="gMagenta" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f783ac"/><stop offset="1" stop-color="#a61e4d"/></linearGradient>
    <symbol id="hibisco" viewBox="-50 -50 100 100"><path d="M0 0C-22-6-30-34-10-44C0-49 12-47 18-40C28-26 14-8 0 0Z"/><path transform="rotate(72)" d="M0 0C-22-6-30-34-10-44C0-49 12-47 18-40C28-26 14-8 0 0Z"/><path transform="rotate(144)" d="M0 0C-22-6-30-34-10-44C0-49 12-47 18-40C28-26 14-8 0 0Z"/><path transform="rotate(216)" d="M0 0C-22-6-30-34-10-44C0-49 12-47 18-40C28-26 14-8 0 0Z"/><path transform="rotate(288)" d="M0 0C-22-6-30-34-10-44C0-49 12-47 18-40C28-26 14-8 0 0Z"/><circle r="13" fill="#7a1035" opacity=".25"/><path d="M0 0L15-27" stroke="#9c1c45" stroke-width="2.5" stroke-linecap="round" fill="none"/><circle cx="15" cy="-28" r="3.6" fill="#ffd43b"/><circle cx="11" cy="-30" r="2.4" fill="#ffd43b"/><circle cx="18" cy="-24" r="2.4" fill="#ffd43b"/></symbol>
    <symbol id="lirio" viewBox="-50 -50 100 100"><path d="M0 0C-10-12-10-34 0-49C10-34 10-12 0 0Z"/><path transform="rotate(60)" d="M0 0C-10-12-10-34 0-49C10-34 10-12 0 0Z"/><path transform="rotate(120)" d="M0 0C-10-12-10-34 0-49C10-34 10-12 0 0Z"/><path transform="rotate(180)" d="M0 0C-10-12-10-34 0-49C10-34 10-12 0 0Z"/><path transform="rotate(240)" d="M0 0C-10-12-10-34 0-49C10-34 10-12 0 0Z"/><path transform="rotate(300)" d="M0 0C-10-12-10-34 0-49C10-34 10-12 0 0Z"/><g stroke="#8a3a12" stroke-width="1.6" stroke-linecap="round"><path d="M0 0L-7-20"/><path d="M0 0L7-19"/><path d="M0 0L0-22"/></g></symbol>
    <symbol id="florzinha" viewBox="-20 -20 40 40"><circle cx="0" cy="-9" r="7.5"/><circle cx="8.6" cy="-2.8" r="7.5"/><circle cx="5.3" cy="7.3" r="7.5"/><circle cx="-5.3" cy="7.3" r="7.5"/><circle cx="-8.6" cy="-2.8" r="7.5"/><circle r="5" fill="#f76707"/></symbol>
    <symbol id="folha" viewBox="0 -20 100 40"><path d="M0 0C25-18 65-20 100 0C65 20 25 18 0 0Z"/><path d="M4 0L96 0" stroke="rgba(0,0,0,.18)" stroke-width="1.4"/></symbol>
    <symbol id="buque" viewBox="0 0 300 300"><g transform="translate(150 150)"><g transform="rotate(-165)"><use href="#folha" y="-30" width="150" height="60" fill="#2f7a46"/></g><g transform="rotate(-118)"><use href="#folha" y="-28" width="135" height="56" fill="#a61e4d"/></g><g transform="rotate(-52)"><use href="#folha" y="-30" width="150" height="60" fill="#3d8b52"/></g><g transform="rotate(12)"><use href="#folha" y="-30" width="145" height="58" fill="#2f7a46"/></g><g transform="rotate(68)"><use href="#folha" y="-26" width="125" height="52" fill="#a61e4d"/></g><g transform="rotate(138)"><use href="#folha" y="-30" width="140" height="58" fill="#3d8b52"/></g></g><use href="#lirio" x="40" y="48" width="104" height="104" fill="url(#gLaranja)"/><use href="#lirio" x="168" y="78" width="96" height="96" fill="url(#gAmarelo)"/><use href="#hibisco" x="84" y="84" width="132" height="132" fill="url(#gRosa)"/><use href="#hibisco" x="166" y="160" width="86" height="86" fill="url(#gLaranja)"/><use href="#florzinha" x="92" y="192" width="46" height="46" fill="#ffd43b"/><use href="#florzinha" x="148" y="42" width="40" height="40" fill="url(#gMagenta)"/><use href="#florzinha" x="226" y="150" width="38" height="38" fill="#ffd43b"/><use href="#florzinha" x="56" y="140" width="34" height="34" fill="#ffa94d"/></symbol>
  </defs></svg>

  <div class="card" id="card">
    <div class="sky"></div><div class="sun"></div><div class="sea"></div>
    <svg class="bq tl" viewBox="0 0 300 300"><use href="#buque"/></svg>
    <svg class="bq tr" viewBox="0 0 300 300"><use href="#buque"/></svg>
    <svg class="bq bl" viewBox="0 0 300 300"><use href="#buque"/></svg>
    <svg class="bq br" viewBox="0 0 300 300"><use href="#buque"/></svg>

    <div class="top"><div class="sig">Save the</div><p>DATE</p></div>
    <div class="bottom">
      <h1 class="names"><b id="n1">Noiva</b><span>&amp;</span><b id="n2">Noivo</b></h1>
      <p class="date" id="dt">00 · 00 · 0000</p>
      <p class="city" id="city">Cidade</p>
      <p class="note">Convite oficial em breve</p>
    </div>
    <p class="brand">Convida&amp;u</p>
  </div>

  <script>
    /* ===== DADOS — edite aqui ===== */
    const STD = { noiva: 'Jessica', noivo: 'Mauricio', data: '2027-07-10', cidade: 'Nova Iguaçu · RJ' };   // data: 'AAAA-MM-DD'
    /* =============================== */
    document.getElementById('n1').textContent = STD.noiva;
    document.getElementById('n2').textContent = STD.noivo;
    if (STD.data) { const [a, m, d] = STD.data.split('-'); document.getElementById('dt').textContent = `${d} · ${m} · ${a}`; }
    if (STD.cidade) document.getElementById('city').textContent = STD.cidade; else document.getElementById('city').remove();
  </script>
</body>
</html>
