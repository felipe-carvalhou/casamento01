<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Casamento • Jessica & Mauricio</title>
  <meta name="description" content="Você recebeu um convite de casamento. Toque no envelope para abrir." />
  <meta property="og:title" content="Jessica & Mauricio • Casamento" />
  <meta property="og:description" content="Você recebeu um convite 🌺 Toque para abrir." />
  <meta name="theme-color" content="#ff9a62" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,wght@0,400;0,500;1,400&family=Mrs+Saint+Delafield&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="preload" as="image" href="envelope.webp">
  <link rel="prefetch" href="convite.html">
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{min-height:100%;background:#f98d63}
    body{font-family:'Montserrat',system-ui,sans-serif;color:#fff;overflow:hidden;-webkit-tap-highlight-color:transparent}

    /* ===== FUNDO PÔR DO SOL ===== */
    .bg{position:fixed;inset:0;
      background:
        radial-gradient(circle at 50% 40%, rgba(255,246,214,.75) 0, rgba(255,226,160,.35) 18%, transparent 42%),
        linear-gradient(180deg,#ffd98a 0%,#ffb76b 26%,#ff8f5e 50%,#f97a7f 72%,#e9688a 100%)}
    .grain{position:fixed;inset:0;pointer-events:none;opacity:.12;mix-blend-mode:soft-light;background-image:radial-gradient(rgba(255,255,255,.9) 1px,transparent 1.2px);background-size:4px 4px}
    .bouquet{position:fixed;width:250px;height:250px;pointer-events:none;filter:drop-shadow(0 8px 12px rgba(120,30,40,.3))}
    .bouquet.tl{left:-110px;top:-105px;transform:rotate(160deg)}
    .bouquet.tr{right:-115px;top:-110px;transform:rotate(205deg)}
    .bouquet.bl{left:-105px;bottom:-110px;transform:rotate(25deg)}
    .bouquet.br{right:-115px;bottom:-115px;transform:rotate(-120deg)}
    #petals{position:fixed;inset:0;pointer-events:none;overflow:hidden}
    .petal{position:absolute;top:-30px;border-radius:70% 0 70% 0;opacity:.85;animation:fall linear infinite}
    @keyframes fall{0%{transform:translate(0,0) rotate(0)}100%{transform:translate(var(--sway,40px),110vh) rotate(var(--spin,540deg))}}

    /* ===== CAPA ===== */
    .cover{position:relative;z-index:2;min-height:100vh;min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;
      text-align:center;padding:40px 16px 70px}
    .eyebrow{font-size:10.5px;letter-spacing:.4em;text-transform:uppercase;text-shadow:0 1px 8px rgba(150,40,40,.35);opacity:.95}
    .names{margin-top:12px;font-family:'Bodoni Moda',Georgia,serif;font-weight:400;font-size:clamp(1.9rem,9vw,3rem);line-height:1.05;letter-spacing:.1em;text-transform:uppercase;text-shadow:0 2px 16px rgba(150,40,40,.35)}
    .names b{font-weight:400}
    .names span{display:block;font-family:'Mrs Saint Delafield',cursive;text-transform:none;letter-spacing:0;font-size:1.25em;line-height:.75;margin:.06em 0 .08em}

    /* Envelope (imagem) */
    .env{--w:min(340px,84vw);position:relative;width:var(--w);margin:34px auto 0;border:0;background:none;cursor:pointer;display:block;
      filter:drop-shadow(0 22px 30px rgba(120,40,30,.35));animation:float 4.5s ease-in-out infinite;transition:transform .5s ease}
    .env img{display:block;width:100%;height:auto;user-select:none;-webkit-user-drag:none}
    @keyframes float{0%,100%{transform:translateY(0) rotate(-1deg)}50%{transform:translateY(-8px) rotate(1deg)}}
    .env:focus-visible{outline:2px solid #fff;outline-offset:10px;border-radius:8px}
    /* iniciais gravadas no selo */
    .ini{position:absolute;left:50.25%;top:55.3%;transform:translate(-50%,-50%);font-family:'Bodoni Moda',Georgia,serif;font-size:calc(var(--w) * .052);letter-spacing:.02em;
      color:rgba(255,240,225,.92);text-shadow:0 -1px 0 rgba(140,30,40,.55),0 1px 1px rgba(255,220,190,.35);white-space:nowrap;pointer-events:none}
    .ini em{font-family:'Mrs Saint Delafield',cursive;font-style:normal;font-size:1.05em;margin:0 .04em}
    .glow{position:absolute;left:50.25%;top:55.3%;width:17%;aspect-ratio:1;border-radius:50%;transform:translate(-50%,-50%);pointer-events:none;animation:ping 2.4s ease-out infinite}
    @keyframes ping{0%{box-shadow:0 0 0 0 rgba(255,255,255,.4)}80%,100%{box-shadow:0 0 0 22px rgba(255,255,255,0)}}

    .hint{margin-top:30px;font-size:11px;letter-spacing:.3em;text-transform:uppercase;text-shadow:0 1px 8px rgba(150,40,40,.35)}
    .hint i{display:block;font-style:normal;font-size:16px;letter-spacing:0;margin-top:8px;animation:tap 1.6s ease-in-out infinite}
    @keyframes tap{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}

    /* Abertura */
    .opening .env{animation:none;transform:translateY(-14px) scale(1.06)}
    .opening .glow{display:none}
    .opening .ini{animation:seal .7s ease forwards}
    @keyframes seal{to{opacity:0;transform:translate(-50%,-50%) scale(1.6)}}
    .flash{position:fixed;inset:0;z-index:5;pointer-events:none;background:radial-gradient(circle at 50% 50%,#fffaf0,#ffe9c9 60%,#ffd2b0);opacity:0;transition:opacity .7s ease .55s}
    .opening .flash{opacity:1}

    .brand-footer{position:fixed;left:0;right:0;bottom:0;z-index:3;text-align:center;padding:12px 16px calc(12px + env(safe-area-inset-bottom));font-size:10.5px;letter-spacing:.05em;text-shadow:0 1px 6px rgba(150,40,40,.35)}
    .brand-footer a{color:#fff;font-weight:600;text-decoration:none}
    @media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none !important;transition-duration:.01ms !important}}
  </style>
</head>
<body>
  <!-- flores -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
    <linearGradient id="gRosa" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff9fb8"/><stop offset="1" stop-color="#d6336c"/></linearGradient>
    <linearGradient id="gLaranja" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffc078"/><stop offset="1" stop-color="#f76707"/></linearGradient>
    <linearGradient id="gAmarelo" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffec99"/><stop offset="1" stop-color="#f59f00"/></linearGradient>
    <linearGradient id="gMagenta" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f783ac"/><stop offset="1" stop-color="#a61e4d"/></linearGradient>
    <symbol id="hibisco" viewBox="-50 -50 100 100"><path d="M0 0C-22-6-30-34-10-44C0-49 12-47 18-40C28-26 14-8 0 0Z"/><path transform="rotate(72)" d="M0 0C-22-6-30-34-10-44C0-49 12-47 18-40C28-26 14-8 0 0Z"/><path transform="rotate(144)" d="M0 0C-22-6-30-34-10-44C0-49 12-47 18-40C28-26 14-8 0 0Z"/><path transform="rotate(216)" d="M0 0C-22-6-30-34-10-44C0-49 12-47 18-40C28-26 14-8 0 0Z"/><path transform="rotate(288)" d="M0 0C-22-6-30-34-10-44C0-49 12-47 18-40C28-26 14-8 0 0Z"/><circle r="13" fill="#7a1035" opacity=".25"/><path d="M0 0L15-27" stroke="#9c1c45" stroke-width="2.5" stroke-linecap="round" fill="none"/><circle cx="15" cy="-28" r="3.6" fill="#ffd43b"/><circle cx="11" cy="-30" r="2.4" fill="#ffd43b"/><circle cx="18" cy="-24" r="2.4" fill="#ffd43b"/></symbol>
    <symbol id="lirio" viewBox="-50 -50 100 100"><path d="M0 0C-10-12-10-34 0-49C10-34 10-12 0 0Z"/><path transform="rotate(60)" d="M0 0C-10-12-10-34 0-49C10-34 10-12 0 0Z"/><path transform="rotate(120)" d="M0 0C-10-12-10-34 0-49C10-34 10-12 0 0Z"/><path transform="rotate(180)" d="M0 0C-10-12-10-34 0-49C10-34 10-12 0 0Z"/><path transform="rotate(240)" d="M0 0C-10-12-10-34 0-49C10-34 10-12 0 0Z"/><path transform="rotate(300)" d="M0 0C-10-12-10-34 0-49C10-34 10-12 0 0Z"/><g stroke="#8a3a12" stroke-width="1.6" stroke-linecap="round"><path d="M0 0L-7-20"/><path d="M0 0L7-19"/><path d="M0 0L0-22"/></g></symbol>
    <symbol id="florzinha" viewBox="-20 -20 40 40"><circle cx="0" cy="-9" r="7.5"/><circle cx="8.6" cy="-2.8" r="7.5"/><circle cx="5.3" cy="7.3" r="7.5"/><circle cx="-5.3" cy="7.3" r="7.5"/><circle cx="-8.6" cy="-2.8" r="7.5"/><circle r="5" fill="#f76707"/></symbol>
    <symbol id="folha" viewBox="0 -20 100 40"><path d="M0 0C25-18 65-20 100 0C65 20 25 18 0 0Z"/><path d="M4 0L96 0" stroke="rgba(0,0,0,.18)" stroke-width="1.4"/></symbol>
    <symbol id="buque" viewBox="0 0 300 300"><g transform="translate(150 150)"><g transform="rotate(-165)"><use href="#folha" y="-30" width="150" height="60" fill="#2f7a46"/></g><g transform="rotate(-118)"><use href="#folha" y="-28" width="135" height="56" fill="#a61e4d"/></g><g transform="rotate(-52)"><use href="#folha" y="-30" width="150" height="60" fill="#3d8b52"/></g><g transform="rotate(12)"><use href="#folha" y="-30" width="145" height="58" fill="#2f7a46"/></g><g transform="rotate(68)"><use href="#folha" y="-26" width="125" height="52" fill="#a61e4d"/></g><g transform="rotate(138)"><use href="#folha" y="-30" width="140" height="58" fill="#3d8b52"/></g></g><use href="#lirio" x="40" y="48" width="104" height="104" fill="url(#gLaranja)"/><use href="#lirio" x="168" y="78" width="96" height="96" fill="url(#gAmarelo)"/><use href="#hibisco" x="84" y="84" width="132" height="132" fill="url(#gRosa)"/><use href="#hibisco" x="166" y="160" width="86" height="86" fill="url(#gLaranja)"/><use href="#florzinha" x="92" y="192" width="46" height="46" fill="#ffd43b"/><use href="#florzinha" x="148" y="42" width="40" height="40" fill="url(#gMagenta)"/><use href="#florzinha" x="226" y="150" width="38" height="38" fill="#ffd43b"/><use href="#florzinha" x="56" y="140" width="34" height="34" fill="#ffa94d"/></symbol>
  </defs></svg>

  <div class="bg"></div>
  <div class="grain"></div>
  <svg class="bouquet tl" viewBox="0 0 300 300" aria-hidden="true"><use href="#buque"/></svg>
  <svg class="bouquet tr" viewBox="0 0 300 300" aria-hidden="true"><use href="#buque"/></svg>
  <svg class="bouquet bl" viewBox="0 0 300 300" aria-hidden="true"><use href="#buque"/></svg>
  <svg class="bouquet br" viewBox="0 0 300 300" aria-hidden="true"><use href="#buque"/></svg>
  <div id="petals"></div>

  <main class="cover" id="cover">
    <p class="eyebrow">Você recebeu um convite</p>
    <h1 class="names"><b class="n1">Jessica</b><span>&amp;</span><b class="n2">Mauricio</b></h1>

    <button class="env" id="env" type="button" aria-label="Abrir convite">
      <img src="envelope.webp" alt="Envelope do convite com selo de cera" width="790" height="567">
      <span class="glow"></span>
      <span class="ini" id="ini">J<em>&amp;</em>M</span>
    </button>

    <p class="hint">Toque no envelope<i>👆</i></p>
  </main>
  <div class="flash"></div>

  <footer class="brand-footer">Convite criado por <a href="https://convidaeu.com.br" target="_blank" rel="noopener">Convida&amp;u</a></footer>

  <script>
    /* ===== DADOS DA CAPA — use os mesmos do convite.html ===== */
    const CAPA = { noiva: 'Jessica', noivo: 'Mauricio' };
    /* ========================================================== */

    document.querySelectorAll('.n1').forEach(e => e.textContent = CAPA.noiva);
    document.querySelectorAll('.n2').forEach(e => e.textContent = CAPA.noivo);
    document.getElementById('ini').innerHTML = `${CAPA.noiva[0]}<em>&amp;</em>${CAPA.noivo[0]}`;
    document.title = `Casamento • ${CAPA.noiva} & ${CAPA.noivo}`;

    // Pétalas
    (function(){
      if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
      const cores = ['#ff922b','#f76707','#f06595','#e64980','#ffd43b','#fab005','#ffa8a8'];
      const box = document.getElementById('petals'), n = innerWidth < 640 ? 12 : 18;
      for (let i = 0; i < n; i++) {
        const p = document.createElement('span'), s = 8 + Math.random() * 10;
        p.className = 'petal';
        p.style.width = s + 'px'; p.style.height = s * 1.3 + 'px';
        p.style.left = Math.random() * 100 + '%';
        p.style.background = `linear-gradient(135deg, ${cores[i % cores.length]}, ${cores[(i + 3) % cores.length]})`;
        p.style.animationDuration = (9 + Math.random() * 9) + 's';
        p.style.animationDelay = (-Math.random() * 16) + 's';
        p.style.setProperty('--sway', (Math.random() * 120 - 60) + 'px');
        p.style.setProperty('--spin', (360 + Math.random() * 540) * (Math.random() < .5 ? -1 : 1) + 'deg');
        box.appendChild(p);
      }
    })();

    // Abrir: envelope sobe, selo "rompe", a tela clareia e o convite entra
    let abrindo = false;
    document.getElementById('env').addEventListener('click', () => {
      if (abrindo) return; abrindo = true;
      document.body.classList.add('opening');
      setTimeout(() => { window.location.href = 'convite.html'; }, 1400);
    });
    window.addEventListener('pageshow', () => { abrindo = false; document.body.classList.remove('opening'); });
  </script>
</body>
</html>
